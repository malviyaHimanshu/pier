<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal Browser Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Terminal Browser Settings</h1>
      <p>Configure connection and rendering. Leave font family as <code>auto</code> to auto-detect system Nerd Fonts. A bundled Symbols Nerd fallback is always included.</p>

      <form id="settings-form">
        <h2>Connection</h2>
        <label for="ws-url">WebSocket URL</label>
        <input id="ws-url" name="ws-url" type="text" placeholder="ws://127.0.0.1:4570/terminal" />

        <label for="token">Access Token</label>
        <input id="token" name="token" type="text" placeholder="Paste your terminal token" />

        <h2>Appearance</h2>
        <label for="font-family">Font Family</label>
        <input id="font-family" name="font-family" type="text" placeholder='auto (or e.g. "Geist Mono", "Symbols Nerd Font Mono", monospace)' />

        <div class="grid-2">
          <div>
            <label for="font-size">Font Size</label>
            <input id="font-size" name="font-size" type="number" min="10" max="30" step="1" />
          </div>
          <div>
            <label for="line-height">Line Height</label>
            <input id="line-height" name="line-height" type="number" min="1" max="2" step="0.05" />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="letter-spacing">Letter Spacing</label>
            <input id="letter-spacing" name="letter-spacing" type="number" min="-2" max="5" step="0.1" />
          </div>
          <div>
            <label for="scrollback">Scrollback</label>
            <input id="scrollback" name="scrollback" type="number" min="1000" max="200000" step="1000" />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="cursor-style">Cursor Style</label>
            <select id="cursor-style" name="cursor-style">
              <option value="block">Block</option>
              <option value="underline">Underline</option>
              <option value="bar">Bar</option>
            </select>
          </div>
          <div>
            <label for="theme-preset">Theme Preset</label>
            <select id="theme-preset" name="theme-preset">
              <option value="vscode-dark">VS Code Dark+</option>
              <option value="ghostty-ink">Ghostty Ink</option>
              <option value="midnight-blue">Midnight Blue</option>
            </select>
          </div>
        </div>

        <label class="check-row" for="cursor-blink">
          <input id="cursor-blink" name="cursor-blink" type="checkbox" />
          <span>Blinking cursor</span>
        </label>

        <label class="check-row" for="mac-option-meta">
          <input id="mac-option-meta" name="mac-option-meta" type="checkbox" />
          <span>Map Option key to Meta (macOS style)</span>
        </label>

        <label class="check-row" for="prefer-webgl">
          <input id="prefer-webgl" name="prefer-webgl" type="checkbox" />
          <span>Prefer WebGL renderer (faster when available)</span>
        </label>

        <div class="actions">
          <button type="button" id="generate-token">Generate Token</button>
          <button type="submit">Save Settings</button>
        </div>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="options.js"></script>
  </body>
</html>
